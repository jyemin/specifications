description: "expectWireMessages-source-omitted"

schemaVersion: "1.30"

runOnRequirements:
  - topologies: [ single, replicaset, sharded ]

createEntities:
  - client:
      id: &client0 client0
      useMultipleMongoses: false
      observeWireMessages:
        connections: [ application, monitor ]
        phases: [ handshake, operation ]

tests:
  - description: "omitting source is an error when the client observes monitor messages"
    operations:
      - name: waitForWireMessages
        object: testRunner
        arguments: { client: *client0, source: monitor, count: 1 }
    expectWireMessages:
      - client: *client0
        # source is omitted, which means every recorded message, and the client records monitor messages
        messages: []
