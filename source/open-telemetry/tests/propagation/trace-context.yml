description: trace-context

schemaVersion: '1.30'

runOnRequirements:
  # The messages that the client writes change if the environment enables compression.
  - compression: false

createEntities:
  # Tracing is enabled, so commands that have a command span carry its trace context.
  - client:
      id: &tracingClient tracingClient
      useMultipleMongoses: false
      uriOptions:
        # A single connection, so that the order of the messages is deterministic.
        maxPoolSize: 1
      observeTracingMessages:
        enableCommandPayload: true
      observeWireMessages:
        connections: [ application ]
        phases: [ operation ]
  # Tracing is not enabled.
  - client:
      id: &plainClient plainClient
      useMultipleMongoses: false
      uriOptions:
        maxPoolSize: 1
      observeWireMessages:
        connections: [ application ]
        phases: [ operation ]
  # Tracing is enabled, and the handshake is observed.
  - client:
      id: &handshakeClient handshakeClient
      useMultipleMongoses: false
      observeTracingMessages:
        enableCommandPayload: true
      observeWireMessages:
        connections: [ application ]
        phases: [ handshake ]
  - database:
      id: &database0 database0
      client: *tracingClient
      databaseName: &databaseName trace-context
  - collection:
      id: &collection0 collection0
      database: *database0
      collectionName: &collectionName test
  - database:
      id: &plainDatabase plainDatabase
      client: *plainClient
      databaseName: *databaseName
  - collection:
      id: &plainCollection plainCollection
      database: *plainDatabase
      collectionName: *collectionName
  - database:
      id: &handshakeDatabase handshakeDatabase
      client: *handshakeClient
      databaseName: *databaseName
  - collection:
      id: &handshakeCollection handshakeCollection
      database: *handshakeDatabase
      collectionName: *collectionName

initialData:
  - collectionName: *collectionName
    databaseName: *databaseName
    documents: []

tests:
  - description: a command carries the trace context of its command span in a payload type 3 section
    runOnRequirements:
      # The trace context is only sent to servers with a maxWireVersion of at least 29.
      - minServerVersion: '9.0'
    operations:
      - name: find
        object: *collection0
        arguments: { filter: { x: 1 } }
      - name: waitForWireMessages
        object: testRunner
        arguments:
          client: *tracingClient
          source: application
          count: 1
    expectWireMessages:
      - client: *tracingClient
        source: application
        messages:
          - opcode: OP_MSG
            responseTo: 0
            flags: []
            sections:
              - kind: 0
                body:
                  # This test is about the trace context, not the shape of a find, so a driver may add fields to the command.
                  $$matchAsRoot:
                    find: *collectionName
                    filter: { x: 1 }
                    $db: *databaseName
              - kind: 3
                body:
                  otel:
                    traceparent: { $$type: string }

  - description: a command sent to a server that does not support the trace context has no payload type 3 section even if tracing is enabled
    runOnRequirements:
      # A maxWireVersion below 29. The server would not recognize the section.
      - maxServerVersion: '8.99'
    operations:
      - name: find
        object: *collection0
        arguments: { filter: { x: 1 } }
      - name: waitForWireMessages
        object: testRunner
        arguments:
          client: *tracingClient
          source: application
          count: 1
    expectWireMessages:
      - client: *tracingClient
        source: application
        messages:
          - opcode: OP_MSG
            responseTo: 0
            flags: []
            sections:
              - kind: 0
                body:
                  # This test is about the trace context, not the shape of a find, so a driver may add fields to the command.
                  $$matchAsRoot:
                    find: *collectionName
                    filter: { x: 1 }
                    $db: *databaseName

  - description: a command sent by a client that does not have tracing enabled has no payload type 3 section
    operations:
      - name: find
        object: *plainCollection
        arguments: { filter: { x: 1 } }
      - name: waitForWireMessages
        object: testRunner
        arguments:
          client: *plainClient
          source: application
          count: 1
    expectWireMessages:
      - client: *plainClient
        source: application
        messages:
          - opcode: OP_MSG
            responseTo: 0
            flags: []
            sections:
              - kind: 0
                body:
                  # This test is about the trace context, not the shape of a find, so a driver may add fields to the command.
                  $$matchAsRoot:
                    find: *collectionName
                    filter: { x: 1 }
                    $db: *databaseName

  - description: the handshake has no payload type 3 section even if tracing is enabled
    operations:
      # The first command on the client opens the connection and so sends the handshake.
      - name: find
        object: *handshakeCollection
        arguments: { filter: { x: 1 } }
    expectWireMessages:
      - client: *handshakeClient
        source: application
        # Authentication, if the deployment requires it, writes more messages than the first one, which is the hello.
        ignoreExtraMessages: true
        messages:
          - opcode: OP_MSG
            responseTo: 0
            flags: []
            sections:
              - kind: 0
                body:
                  # The shape of the handshake is asserted by the MongoDB Handshake tests, so it is not repeated here.
                  $$matchAsRoot:
                    $db: admin
