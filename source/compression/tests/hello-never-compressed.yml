description: hello-never-compressed
schemaVersion: '1.30'
# OP_COMPRESSED.md: hello and legacy hello MUST NOT be compressed, whoever sends them and whenever.
# The monitor tests cover monitors; this covers an application sending them after the handshake.
runOnRequirements:
  - minServerVersion: '4.4'
    auth: false
    # A load-balanced deployment handshakes with hello and loadBalanced, and has no monitors.
    topologies: [ single, replicaset, sharded ]
    # The messages that the client writes change if the environment enables a server API version.
    serverApi: false
createEntities:
  - client:
      id: &client client
      useMultipleMongoses: false
      uriOptions:
        compressors: zlib
      observeWireMessages:
        connections: [application]
        phases: [operation]
  - database:
      id: &database database
      client: *client
      databaseName: handshake-test
tests:
  - description: an application hello and an application isMaster are sent as plain OP_MSG on a client that compresses
    operations:
      - name: runCommand
        object: *database
        arguments: { commandName: hello, command: { hello: 1 } }
      - name: runCommand
        object: *database
        arguments: { commandName: isMaster, command: { isMaster: 1 } }
      # For contrast: an ordinary command on the same connection IS compressed.
      - name: runCommand
        object: *database
        arguments: { commandName: ping, command: { ping: 1 } }
    expectWireMessages:
      - client: *client
        source: application
        ignoreExtraMessages: true
        messages:
          - opcode: OP_MSG
            responseTo: 0
            flags: []
            sections:
              - kind: 0
                body:
                  hello: 1
                  $db: handshake-test
                  # The implicit session and the cluster time are added by the driver; the first message precedes any cluster time.
                  lsid: { $$type: object }
                  $clusterTime: { $$unsetOrMatches: { $$type: object } }
                  $readPreference: { $$unsetOrMatches: { mode: primaryPreferred } }
          - opcode: OP_MSG
            responseTo: 0
            flags: []
            sections:
              - kind: 0
                body:
                  isMaster: 1
                  $db: handshake-test
                  lsid: { $$type: object }
                  $clusterTime: { $$unsetOrMatches: { $$type: object } }
                  $readPreference: { $$unsetOrMatches: { mode: primaryPreferred } }
          - opcode: OP_COMPRESSED
            responseTo: 0
            originalOpcode: OP_MSG
            compressorId: 2
            uncompressedSize: { $$type: int }
            message:
              flags: []
              sections:
                - kind: 0
                  body:
                    ping: 1
                    $db: handshake-test
                    lsid: { $$type: object }
                    $clusterTime: { $$unsetOrMatches: { $$type: object } }
                    $readPreference: { $$unsetOrMatches: { mode: primaryPreferred } }
