description: client-env-container
schemaVersion: '1.30'
runOnRequirements:
  - minServerVersion: '4.4'
    auth: false
    # A load-balanced deployment handshakes with hello and loadBalanced, and has no monitors.
    topologies: [ single, replicaset, sharded ]
    # The messages that the client writes change if the environment enables compression or a server API version.
    compression: false
    serverApi: false
createEntities:
  - client:
      id: &client client
      useMultipleMongoses: false
      uriOptions:
        appname: &appName handshakeTest
      setHostEnvironment:
        KUBERNETES_SERVICE_HOST: 10.0.0.1
      observeWireMessages:
        connections: [application]
        phases: [handshake]
  - database:
      id: &database database
      client: *client
      databaseName: handshake-test
tests:
  - description: container metadata is nested in client.env, not a sibling of it
    operations:
      - name: runCommand
        object: *database
        arguments: { commandName: ping, command: { ping: 1 } }
    expectWireMessages:
      - client: *client
        messages:
          - opcode: OP_MSG
            responseTo: 0
            flags: []
            command:
              isMaster: 1
              helloOk: true
              backpressure: "2"
              # Drivers that follow the OP_COMPRESSED SHOULD send an empty array when no compressor is configured; others omit it.
              compression: { $$unsetOrMatches: [] }
              client:
                application: { name: *appName }
                driver:
                  name: { $$type: string }
                  version: { $$type: string }
                os:
                  type: { $$type: string }
                  name: { $$unsetOrMatches: { $$type: string } }
                  architecture: { $$unsetOrMatches: { $$type: string } }
                  version: { $$unsetOrMatches: { $$type: string } }
                platform: { $$unsetOrMatches: { $$type: string } }
                # env holds container, and agent if an agent's environment variables are set on the host.
                env:
                  container:
                    orchestrator: kubernetes
                    # Set to docker iff the host has /.dockerenv, which a test cannot control.
                    runtime: { $$unsetOrMatches: docker }
                  agent: { $$unsetOrMatches: { $$type: string } }
              $db: admin
              $readPreference: { $$unsetOrMatches: { mode: primaryPreferred } }
